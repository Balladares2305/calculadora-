<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calculadora web sencilla para operaciones matemáticas básicas."
    />
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="eyebrow">UNIVERSIDAD TÈCNICA DE MANABÌ</p>
        <h1>Calculadora</h1>
      </header>

      <section class="calculator" aria-label="Calculadora">
        <div class="display" aria-live="polite" aria-atomic="true">
          <p class="display-expression" id="expression"></p>
          <p class="display-value" id="display">0</p>
        </div>

        <div class="keypad" aria-label="Teclas de la calculadora">
          <button class="key key-utility" type="button" data-action="clear" aria-label="Borrar todo">AC</button>
          <button class="key key-utility" type="button" data-action="delete" aria-label="Borrar último dígito">DEL</button>
          <button class="key key-utility" type="button" data-action="sign" aria-label="Cambiar signo">+/−</button>
          <button class="key key-operator" type="button" data-operator="/" aria-label="Dividir">÷</button>

          <button class="key" type="button" data-digit="7">7</button>
          <button class="key" type="button" data-digit="8">8</button>
          <button class="key" type="button" data-digit="9">9</button>
          <button class="key key-operator" type="button" data-operator="*" aria-label="Multiplicar">×</button>

          <button class="key" type="button" data-digit="4">4</button>
          <button class="key" type="button" data-digit="5">5</button>
          <button class="key" type="button" data-digit="6">6</button>
          <button class="key key-operator" type="button" data-operator="-" aria-label="Restar">−</button>

          <button class="key" type="button" data-digit="1">1</button>
          <button class="key" type="button" data-digit="2">2</button>
          <button class="key" type="button" data-digit="3">3</button>
          <button class="key key-operator" type="button" data-operator="+" aria-label="Sumar">+</button>

          <button class="key key-zero" type="button" data-digit="0">0</button>
          <button class="key" type="button" data-action="decimal" aria-label="Punto decimal">.</button>
          <button class="key key-equals" type="button" data-action="equals" aria-label="Igual">=</button>
        </div>
        <p class="keyboard-hint">DANNY BALLADARES CHERRES</p>
      </section>

      <footer>GRUPODE TRABAJO #1</footer>

    </main>
  </body>
</html>
